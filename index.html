<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Diário</title>
    <!-- Adicionando fonte Inter para um visual moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* 
           PASSO 1: VARIÁVEIS DE CORES 
           Aqui definimos as cores baseadas no seu screenshot para manter a estética. 
        */
        :root {
            --bg-body: #050e1d;
            /* Fundo bem escuro */
            --bg-panel: #0b1a30;
            /* Fundo dos painéis e áreas */
            --bg-row-alt: #0d213b;
            /* Linhas alternadas da tabela */
            --primary-cyan: #00d2ff;
            /* Azul claro vivo para botões ativos */
            --text-light: #ffffff;
            /* Texto branco */
            --text-muted: #8ca3c7;
            /* Texto secundário/apagado */
            --btn-dark: #142745;
            /* Botão inativo escuro */
            --border-color: #1e3a5f;
            /* Borda suave */
            --input-border: #008eb3;
            /* Borda azul do input de saída */
        }

        /* 
           PASSO 2: RESET BÁSICO E TIPOGRAFIA
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            /* Evita seleção acidental no touch do celular */
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container principal simulando a tela de um iPhone 14 Pro Max */
        #app-container {
            width: 100%;
            max-width: 430px;
            /* Largura base do iPhone Pro Max */
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        /* 
           PASSO 3: ESTILOS DO CABEÇALHO E TOP BAR
        */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .header-arrow {
            color: var(--primary-cyan);
            font-size: 20px;
            cursor: pointer;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
        }

        /* Botões Diurno / Noturno */
        .shift-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .shift-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .shift-btn.active {
            background-color: var(--primary-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .shift-btn.inactive {
            background-color: var(--btn-dark);
            color: var(--text-muted);
        }

        /*
           PASSO 4: TOTAL INICIAL
        */
        .total-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .total-input {
            background-color: var(--btn-dark);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 16px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            width: 60px;
            text-align: center;
            outline: none;
        }

        .total-input:focus {
            border-color: var(--primary-cyan);
        }

        /*
           PASSO 5: TABELA DE DADOS
        */
        .table-container {
            background-color: var(--bg-panel);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .table-header,
        .table-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            text-align: center;
            align-items: center;
        }

        .table-header {
            background-color: var(--bg-panel);
            padding: 14px 5px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-row {
            padding: 10px 5px;
            font-size: 18px;
        }

        /* Zebrado para as linhas (intercalando as cores igual o screenshot) */
        .table-row:nth-child(even) {
            background-color: var(--bg-row-alt);
            /* Cor mais clara */
        }

        .table-row:nth-child(odd) {
            background-color: var(--bg-panel);
            /* Cor mais escura */
        }

        .cell-saida input {
            background-color: transparent;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-light);
            text-align: center;
            width: 80%;
            padding: 4px;
            font-size: 20px;
            outline: none;
        }

        .cell-saida input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 5px rgba(0, 210, 255, 0.4);
        }

        .cell-resto {
            font-weight: 700;
            color: var(--text-light);
        }

        /*
           PASSO 6: BOTÕES INFERIORES
        */
        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            /* Empurra para o fundo se houver espaço */
        }

        .action-btn {
            flex: 1;
            background-color: var(--btn-dark);
            color: var(--primary-cyan);
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
            background-color: var(--border-color);
        }

        /* 
           TELA DE LOGIN SOBREPOSTA
        */
        #login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-body);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: inherit;
        }

        .login-box {
            background-color: var(--bg-panel);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--btn-dark);
            color: white;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-cyan);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- CONTAINER PRINCIPAL DO APP -->
    <div id="app-container">

        <!-- Tela de Login (Ocultar com a classe "hidden" quando logado) -->
        <div id="login-overlay">
            <div class="login-box">
                <h2>Login</h2>
                <input type="email" id="email" class="login-input" placeholder="Email" />
                <input type="password" id="password" class="login-input" placeholder="Senha" />
                <button class="login-btn" onclick="handleLogin()">Entrar</button>
            </div>
        </div>

        <!-- Cabeçalho -->
        <header>
            <span class="header-arrow" onclick="fazerLogout()">Sair</span>
            <h1>Controle Diario</h1>
            <span class="header-arrow" style="visibility: hidden;">→</span>
        </header>

        <!-- Seleção de Turno -->
        <div class="shift-toggle">
            <button class="shift-btn active">☀️ Diurno</button>
            <button class="shift-btn inactive">🌙 Noturno</button>
        </div>

        <!-- Total Inicial -->
        <div class="total-container">
            <span>Total Inicial:</span>
            <input type="number" id="total-inicial" class="total-input" value="44" onblur="salvarDados(true)">
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <!-- Cabeçalho da Tabela -->
            <div class="table-header">
                <div>Horario</div>
                <div>Saida</div>
                <div>Resto</div>
                <div>Driver</div>
            </div>

            <!-- Corpo da Tabela (10 linhas geradas dinamicamente ou estáticas) -->
            <div id="table-body">
                <!-- Vamos gerar isso via Javascript para facilitar o didatismo, 
                     mas para preview, deixo 3 linhas de exemplo -->
            </div>
        </div>

        <!-- Botões de Ação Inferiores -->
        <div class="bottom-actions">
            <button class="action-btn" onclick="setDriver()">SetDrv</button>
            <button class="action-btn" onclick="salvarDados()">Salvar</button>
            <button class="action-btn" onclick="recarregarDados()">Recarregar</button>
        </div>

    </div>

    <!-- SUPABASE IMPORT -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- LÓGICA DO APP (JAVASCRIPT) -->
    <script>
        // --- PASSO 7: CONFIGURAÇÃO SUPABASE ---
        // 1. Crie um projeto em supabase.com
        // 2. Vá em Project Settings -> API e copie a URL e a anon_key
        const SUPABASE_URL = 'https://nqqlbzacqszwmlqkdxji.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xcWxiemFjcXN6d21scWtkeGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMTEwNDUsImV4cCI6MjA5MDU4NzA0NX0.YLiZzYksKxYs3Hpt_i0FNwtmVoCE3Z66WrnTa7vULQ0';

        // Inicializa o cliente Supabase com as chaves acima
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Variáveis de Estado da Aplicação ---
        let currentDriver = localStorage.getItem('driverName') || '';
        let currentTurno = 'Diurno'; // Pode ser 'Diurno' ou 'Noturno'
        let currentRecordId = null; // Guardará o ID do banco de dados para a data atual
        let loggedInUserId = null; // Guardará o ID do usuário após o login

        // Base de horários conforme seu screenshot
        const horariosBase = [
            "5:35", "5:35", "6:05", "6:35", "7:05",
            "7:15", "7:35", "8:05", "8:35", "9:05"
        ];

        // Lógica dos Botões de Turno
        const btnDiurno = document.querySelector('.shift-btn:nth-child(1)');
        const btnNoturno = document.querySelector('.shift-btn:nth-child(2)');

        btnDiurno.onclick = () => {
            currentTurno = 'Diurno';
            btnDiurno.classList.replace('inactive', 'active');
            btnNoturno.classList.replace('active', 'inactive');
            recarregarDados(); // Recarrega os dados ao trocar turno
        };

        btnNoturno.onclick = () => {
            currentTurno = 'Noturno';
            btnNoturno.classList.replace('inactive', 'active');
            btnDiurno.classList.replace('active', 'inactive');
            recarregarDados(); // Recarrega os dados ao trocar turno
        };

        // --- PASSO 8: RENDERIZAR A TABELA ---
        // Função didática para desenhar as 10 linhas no HTML
        function renderTable(dadosSalvos = null) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ''; // Limpa antes de desenhar

            horariosBase.forEach((horario, index) => {
                // Se recebemos dados salvos do Supabase, usamos eles
                const valorSaida = dadosSalvos && dadosSalvos[index] && dadosSalvos[index].saida ? dadosSalvos[index].saida : '';
                const valorDriver = dadosSalvos && dadosSalvos[index] && dadosSalvos[index].driver ? dadosSalvos[index].driver : '';

                const row = document.createElement('div');
                row.className = 'table-row';

                row.innerHTML = `
                    <div class="cell-horario">${horario}</div>
                    <div class="cell-saida">
                        <input type="number" 
                               id="saida-${index}" 
                               class="saida-input" 
                               value="${valorSaida}"
                               oninput="handleSaidaInput(${index})" 
                               onfocus="stampDriver(${index})"
                               onblur="salvarDados(true)">
                    </div>
                    <div class="cell-resto" id="resto-${index}"></div>
                    <div class="cell-driver" id="driver-${index}">${valorDriver}</div>
                `;
                tbody.appendChild(row);
            });

            // Recalcula logo após desenhar para caso haja dados pré-preenchidos
            recalcularResto();
        }

        // --- PASSO 9: LÓGICA DE NEGÓCIO ---

        // 9.1: Motorista Local (LocalStorage)
        function setDriver() {
            const driverName = prompt("Digite o nome do Motorista para este celular:", currentDriver);
            if (driverName !== null && driverName.trim() !== '') {
                currentDriver = driverName.trim();
                localStorage.setItem('driverName', currentDriver);
                alert("Motorista configurado: " + currentDriver);
            }
        }

        // 9.2: Carimbar Motorista ao tocar no Input
        function stampDriver(index) {
            if (!currentDriver) {
                alert("Por favor, configure o Motorista clicando em SetDrv primeiro!");
                return;
            }
            // Apenas carimba se o campo estiver vazio, evitando sobrescrever sem querer
            const driverCell = document.getElementById(`driver-${index}`);
            if (driverCell.innerText === "") {
                driverCell.innerText = currentDriver;
            }
        }

        // 9.3: Lidar com a digitação da Saída
        function handleSaidaInput(index) {
            // Garante que o motorista esteja carimbado
            stampDriver(index);
            // Ao digitar, recalcula todos os restos abaixo
            recalcularResto();
        }

        // 9.4: Matemática da Coluna "Resto"
        function recalcularResto() {
            const totalInicialElement = document.getElementById('total-inicial');
            let saldoAtual = parseFloat(totalInicialElement.value) || 0;

            // Percorre as 10 linhas
            for (let i = 0; i < horariosBase.length; i++) {
                const inputSaida = document.getElementById(`saida-${i}`);
                const valorSaida = parseFloat(inputSaida.value);
                const celulaResto = document.getElementById(`resto-${i}`);

                // Se houver valor numérico na saída, subtrai do saldo
                if (!isNaN(valorSaida) && inputSaida.value !== "") {
                    saldoAtual -= valorSaida;
                    celulaResto.innerText = saldoAtual;
                } else {
                    // Se estiver vazio, apenas mostra o restante ou limpa
                    celulaResto.innerText = "";
                }
            }
        }

        // Ouve mudanças no total inicial para recalcular a tabela inteira
        document.getElementById('total-inicial').addEventListener('input', recalcularResto);

        // --- PASSO 10: INTEGRAÇÃO REAL SUPABASE ---

        // No Supabase, você precisa ter uma tabela chamada: `registros_diarios`
        // Colunas (Schema):
        // 1. id (int8 ou uuid, primary key)
        // 2. data (date)
        // 3. turno (text)
        // 4. total_inicial (numeric)
        // 5. linhas (jsonb) -> Aqui salvaremos as 10 linhas juntas

        // 10.1 Login Autenticado
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Preencha email e senha.");
                return;
            }

            try {
                // Tenta logar no Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Sucesso
                loggedInUserId = data.user.id; // Guarda o ID do usuário para usar no 'salvar'
                document.getElementById('login-overlay').classList.add('hidden');
               // alert("Login efetuado com sucesso!");
                recarregarDados(); // Puxa os dados após o login

            } catch (error) {
                alert("Erro ao logar: " + error.message + "\n\n(Verifique se as chaves da linha 254 estão corretas!)");
            }
        }

        // 10.2 Verificar Sessão Ativa
        async function checkSession() {
            // Pula a checagem se não houver sessão

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                loggedInUserId = session.user.id; // Guarda o ID do usuário para usar no 'salvar'
                document.getElementById('login-overlay').classList.add('hidden');
                recarregarDados();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        }

        // 10.2.5 Fazer Logout (Sair)
        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            loggedInUserId = null;

            // Limpa a tabela da tela
            document.getElementById('total-inicial').value = '';
            renderTable();

            // Volta para a tela de Login
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        // 10.3 Puxar do Supabase
        async function recarregarDados() {
            // URL real já definida, buscando dados...

            const hoje = new Date().toISOString().split('T')[0]; // ex: "2024-04-01"

            try {
                const { data, error } = await supabaseClient
                    .from('registros_diarios')
                    .select('*')
                    .eq('data', hoje)
                    .eq('turno', currentTurno)
                    .single(); // Espera apenas 1 registro para este dia/turno

                if (error && error.code !== 'PGRST116') { // Ignora erro se não encontrou nada (PGRST116)
                    throw error;
                }

                if (data) {
                    currentRecordId = data.id; // Guarda o id para sabermos que precisamos "atualizar" (update) e não "inserir" (insert)
                    document.getElementById('total-inicial').value = data.total_inicial;
                    renderTable(data.linhas); // Passa o JSON salvo contendo as saidas/drivers para reescrever
                  //  alert("Dados do turno " + currentTurno + " recarregados!");
                } else {
                    // Novo dia ou turno, reseta tudo localmente
                    currentRecordId = null;
                    document.getElementById('total-inicial').value = '';
                    renderTable();
                }

            } catch (error) {
                console.error("Erro ao puxar dados: ", error);
                alert("Erro ao recarregar dados.");
            }
        }

        // 10.4 Enviar para o banco (Pode ser silencioso se acionado automaticamente)
        async function salvarDados(silencioso = false) {
            // Prossegue com salvamento

            const totalInicial = document.getElementById('total-inicial').value;
            const hoje = new Date().toISOString().split('T')[0];

            // Montar objeto das 10 linhas
            const linhas = [];
            for (let i = 0; i < horariosBase.length; i++) {
                const saida = document.getElementById(`saida-${i}`).value;
                const driver = document.getElementById(`driver-${i}`).innerText;
                const resto = document.getElementById(`resto-${i}`).innerText;

                linhas.push({
                    horario: horariosBase[i],
                    saida: saida ? parseFloat(saida) : null,
                    resto: resto ? parseFloat(resto) : null,
                    driver: driver
                });
            }

            const payload = {
                data: hoje,
                turno: currentTurno,
                total_inicial: parseFloat(totalInicial) || 0,
                linhas: linhas,
                user_id: loggedInUserId // Incluído para bater com a sua nova coluna 'user_id'
            };

            try {
                if (currentRecordId) {
                    // Já existe no banco hoje, faz um UPDATE
                    const { error } = await supabaseClient
                        .from('registros_diarios')
                        .update(payload)
                        .eq('id', currentRecordId);
                    if (error) throw error;
                  //  if (!silencioso) alert("Dados Atualizados com Sucesso!");
                } else {
                    // É a primeira vez salvando neste dia/turno, faz INSERT
                    const { data, error } = await supabaseClient
                        .from('registros_diarios')
                        .insert([payload])
                        .select(); // Retorna o que foi inserido
                    if (error) throw error;

                    if (data && data.length > 0) {
                        currentRecordId = data[0].id; // Salva o novo ID
                    }
                    if (!silencioso) alert("Novos Dados Inseridos com Sucesso!");
                }

            } catch (error) {
                console.error("Erro ao salvar: ", error);
                if (!silencioso) alert("Erro ao salvar no banco. Verifique o console.");
            }
        }

        // Iniciar App (Verificando Sessão)
        window.onload = () => {
            // Checa a sessão assim que abrir a página
            checkSession();
        };

    </script>
</body>

</html>
